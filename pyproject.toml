[project]
name = "jurassic-plots"
version = "0.1.0"
description = "Team to visualize the tirex-2 model outputs"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "anywidget>=0.11.0",
    "captum>=0.9.0",
    "datasets",
    "gluonts",
    "ipywidgets>=8.1.9",
    "lime>=0.2.0.1",
    "notebook>=7.6.3",
    "pandas>=2.0.0,<3",
    "plotly>=7.1.0",
    "python-dotenv",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "statsmodels>=0.15.0",
    "tirex-2[examples]>=0.3.1",
    "torch>=2.12.0",
    "umap-learn>=0.6.0",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff]
extend-include = ["*.ipynb"]

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu134", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu134", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
